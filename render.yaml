services:
  - type: web
    name: agha-accounting
    runtime: python
    plan: free
    rootDir: project
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn ui.app:app --worker-class uvicorn_worker.UvicornWorker --workers 1 --bind 0.0.0.0:$PORT --timeout 180 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AGHA_DATA_DIR
        value: /tmp/agha-data
      - key: AGHA_USERNAME
        value: agha
      - key: AGHA_PASSWORD
        sync: false
