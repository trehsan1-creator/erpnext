services:
  - type: web
    name: agha-accounting
    runtime: python
    plan: free
    buildCommand: ./render-build.sh
    startCommand: ./render-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AGHA_DATA_DIR
        value: /tmp/agha-data
      - key: AGHA_USERNAME
        value: agha
      - key: AGHA_PASSWORD
        sync: false
